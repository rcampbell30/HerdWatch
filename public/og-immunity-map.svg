    <circle cx="42" cy="42" r="15" fill="#d97706"/>
    <text x="72" y="51" fill="#92400e" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">90%–&lt;95%</text>
  </g>
  <g transform="translate(676 455)">
